<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="system-ui,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#5a3fd0"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22d3a8"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#0f1220"/>
  <text x="480" y="34" fill="#e8eaf6" font-size="20" font-weight="bold" text-anchor="middle">Pipeline del RAG de logs · 6 pasos → 3 fases</text>

  <!-- fase 1 -->
  <rect x="30" y="60" width="270" height="250" rx="12" fill="#1a1f35" stroke="#7c5cff"/>
  <text x="165" y="86" fill="#7c5cff" font-size="14" font-weight="bold" text-anchor="middle">FASE 1 · INGESTA</text>
  <g>
    <rect x="55" y="105" width="220" height="52" rx="9" fill="#222842" stroke="#2c3357"/>
    <text x="165" y="128" fill="#e8eaf6" font-size="14" font-weight="bold" text-anchor="middle">0 · Parsear y reparar</text>
    <text x="165" y="147" fill="#9aa3c7" font-size="11" text-anchor="middle">parse.py · cascada de parsers</text>
  </g>
  <g>
    <rect x="55" y="167" width="220" height="52" rx="9" fill="#222842" stroke="#2c3357"/>
    <text x="165" y="190" fill="#e8eaf6" font-size="14" font-weight="bold" text-anchor="middle">1 · Armar la traza</text>
    <text x="165" y="209" fill="#9aa3c7" font-size="11" text-anchor="middle">trace.py · agrupar por trace_id</text>
  </g>
  <g>
    <rect x="55" y="229" width="220" height="52" rx="9" fill="#222842" stroke="#2c3357"/>
    <text x="165" y="252" fill="#e8eaf6" font-size="14" font-weight="bold" text-anchor="middle">2 · Resumen narrativo</text>
    <text x="165" y="271" fill="#9aa3c7" font-size="11" text-anchor="middle">trace.py · se vectoriza</text>
  </g>

  <!-- flecha F1->F2 -->
  <line x1="300" y1="180" x2="360" y2="180" stroke="#22d3a8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- fase 2 -->
  <rect x="365" y="60" width="270" height="250" rx="12" fill="#1a1f35" stroke="#22d3a8"/>
  <text x="500" y="86" fill="#22d3a8" font-size="14" font-weight="bold" text-anchor="middle">FASE 2 · ALMACÉN DUAL</text>
  <g>
    <rect x="390" y="110" width="220" height="60" rx="9" fill="#222842" stroke="#2c3357"/>
    <text x="500" y="136" fill="#e8eaf6" font-size="14" font-weight="bold" text-anchor="middle">3 · Vector (pgvector)</text>
    <text x="500" y="156" fill="#9aa3c7" font-size="11" text-anchor="middle">embedding 64d · tabla traces</text>
  </g>
  <g>
    <rect x="390" y="185" width="220" height="60" rx="9" fill="#222842" stroke="#2c3357"/>
    <text x="500" y="211" fill="#e8eaf6" font-size="14" font-weight="bold" text-anchor="middle">4 · Grafo causal (Neo4j)</text>
    <text x="500" y="231" fill="#9aa3c7" font-size="11" text-anchor="middle">nodos + CAUSED_BY</text>
  </g>

  <!-- flecha F2->F3 -->
  <line x1="635" y1="180" x2="695" y2="180" stroke="#f5b84b" stroke-width="3"/>

  <!-- fase 3 -->
  <rect x="700" y="60" width="230" height="250" rx="12" fill="#1a1f35" stroke="#f5b84b"/>
  <text x="815" y="86" fill="#f5b84b" font-size="14" font-weight="bold" text-anchor="middle">FASE 3 · RESPUESTA</text>
  <g>
    <rect x="725" y="145" width="180" height="52" rx="9" fill="#222842" stroke="#2c3357"/>
    <text x="815" y="168" fill="#e8eaf6" font-size="14" font-weight="bold" text-anchor="middle">5 · Búsqueda híbrida</text>
    <text x="815" y="187" fill="#9aa3c7" font-size="11" text-anchor="middle">services.py</text>
  </g>
  <g>
    <rect x="725" y="207" width="180" height="52" rx="9" fill="#222842" stroke="#2c3357"/>
    <text x="815" y="230" fill="#e8eaf6" font-size="14" font-weight="bold" text-anchor="middle">6 · Capa respuesta</text>
    <text x="815" y="249" fill="#9aa3c7" font-size="11" text-anchor="middle">answer.py + llm/</text>
  </g>

  <!-- nota inferior -->
  <text x="480" y="400" fill="#9aa3c7" font-size="13" text-anchor="middle">El paso 5 combina semántica (pgvector) + cadena causal (grafo) → evidencia para el paso 6.</text>
  <text x="480" y="425" fill="#6b7299" font-size="12" text-anchor="middle">Degradación segura: sin grafo, el paso 5 responde igual con cadena vacía.</text>
</svg>
