<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Project Trucha</title>
  <desc id="desc">Logo inspirado en un cuadro con dos truchas, un corazón y olas azules.</desc>

  <defs>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123B7A"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F2A4E" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Transparent background -->
  <g filter="url(#softShadow)">
    <!-- Heart -->
    <path d="M600 154
             C560 112 522 87 480 87
             C420 87 384 129 384 181
             C384 253 454 304 600 420
             C746 304 816 253 816 181
             C816 129 780 87 720 87
             C678 87 640 112 600 154Z"
          fill="url(#heart)" transform="translate(0,-34) scale(0.48) translate(650,70)"/>

    <!-- Fish pair -->
    <g fill="#153B72">
      <g transform="translate(370 204)">
        <path d="M0 64 C42 12 146 8 222 64 C146 120 42 116 0 64Z"/>
        <path d="M8 64 L-56 18 L-36 64 L-56 110Z"/>
        <path d="M82 104 L118 132 L126 98Z"/>
        <circle cx="184" cy="49" r="6" fill="#E8F4FF"/>
      </g>
      <g transform="translate(830 204) scale(-1,1)">
        <path d="M0 64 C42 12 146 8 222 64 C146 120 42 116 0 64Z"/>
        <path d="M8 64 L-56 18 L-36 64 L-56 110Z"/>
        <path d="M82 104 L118 132 L126 98Z"/>
        <circle cx="184" cy="49" r="6" fill="#E8F4FF"/>
      </g>
    </g>

    <!-- Small central heart -->
    <path d="M600 288 C578 264 556 250 532 250 C499 250 480 273 480 301 C480 340 520 369 600 432 C680 369 720 340 720 301 C720 273 701 250 668 250 C644 250 622 264 600 288Z"
          fill="url(#heart)" transform="translate(0,-120) scale(0.23) translate(2009,760)"/>

    <!-- Waves -->
    <g transform="translate(120 350)">
      <path d="M0 90 C130 18 238 154 368 86 C498 18 612 162 760 78 C860 22 910 42 960 62 L960 134 C834 90 744 170 608 128 C472 86 382 160 244 126 C128 98 58 116 0 146Z" fill="#BCE7F8"/>
      <path d="M0 118 C136 52 246 182 382 112 C508 46 628 182 774 102 C868 52 920 66 960 86 L960 164 C830 112 742 198 600 148 C474 104 370 190 234 150 C122 118 52 138 0 166Z" fill="#58B8EA"/>
      <path d="M0 150 C120 98 238 206 374 142 C514 76 624 218 768 132 C870 74 922 96 960 118 L960 194 C832 144 734 232 594 180 C460 130 358 216 226 180 C112 148 46 168 0 194Z" fill="#2477C8"/>
      <path d="M0 188 C118 136 222 232 356 180 C502 122 612 248 752 166 C856 104 914 126 960 150 L960 222 C832 176 730 258 586 214 C454 174 346 250 210 220 C102 196 42 206 0 230Z" fill="#163E7A"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="600" y="620" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="74" font-weight="800" letter-spacing="-2"
        fill="url(#brand)">project-trucha</text>

  <text x="600" y="674" text-anchor="middle"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="24" font-weight="600" letter-spacing="7"
        fill="#4F6B88">MEMORIA PERSISTENTE PARA AGENTES</text>
</svg>
