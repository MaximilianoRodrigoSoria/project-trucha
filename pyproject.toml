[project]
name = "trucha"
version = "0.1.0"
description = "Toolkit colaborativo de memoria persistente para agentes de codigo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Maximiliano Soria", email = "maximilianorodrigosoria@gmail.com" },
    { name = "Gerardo Lopez", email = "gerardo.a.lopez1994@gmail.com" },
]
dependencies = []

[project.scripts]
trucha = "trucha.interface.cli:main"
trucha-mcp = "trucha.interface.mcp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
