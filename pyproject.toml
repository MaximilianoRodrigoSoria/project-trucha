[project]
name = "trucha"
version = "0.1.0"
description = "Toolkit colaborativo de memoria persistente para agentes de codigo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Maximiliano Soria", email = "maximilianorodrigosoria@gmail.com" },
    { name = "Gerardo Lopez", email = "gerardo.a.lopez1994@gmail.com" },
]
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "pgvector>=0.4,<1",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
trucha = "trucha.interface.cli:main"
trucha-mcp = "trucha.interface.mcp:main"
trucha-api = "trucha.interface.api.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
extend-ignore = ["B008"] # FastAPI usa Depends/Query en defaults por diseño.
